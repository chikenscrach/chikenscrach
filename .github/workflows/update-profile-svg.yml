name: Update profile SVGs

on:
  schedule:
    # 00:17 UTC = 08:17 Taiwan time. GitHub may start scheduled jobs later.
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile-svg.yml'
      - 'scripts/render_activity.py'

permissions:
  contents: write

concurrency:
  group: profile-svg-updates
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'chikenscrach/chikenscrach' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE_USERNAME: chikenscrach

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare a staging directory
        run: mkdir -p .generated/profile-svg

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: username=${{ env.PROFILE_USERNAME }}&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true
          path: .generated/profile-svg/stats.svg
          token: ${{ github.token }}
          fail_on_error: 'true'

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: username=${{ env.PROFILE_USERNAME }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: .generated/profile-svg/top-langs.svg
          token: ${{ github.token }}
          fail_on_error: 'true'

      - name: Generate GitHub trophies
        uses: ryo-ma/github-profile-trophy@e3c89df995e92e67cdd4b2acaab9d974583dc1f7
        env:
          # The upstream generator retries with a second token slot.
          GITHUB_TOKEN2: ${{ github.token }}
        with:
          username: ${{ env.PROFILE_USERNAME }}
          output_path: .generated/profile-svg/trophies.svg
          theme: tokyonight
          token: ${{ github.token }}

      - name: Generate the contribution graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/render_activity.py --username "$PROFILE_USERNAME" --output .generated/profile-svg/activity.svg

      - name: Generate contribution snake animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ env.PROFILE_USERNAME }}
          github_token: ${{ github.token }}
          outputs: |
            .generated/profile-svg/snake.svg
            .generated/profile-svg/snake-dark.svg?palette=github-dark

      - name: Validate the complete set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          source = Path('.generated/profile-svg')
          names = ('stats.svg', 'top-langs.svg', 'trophies.svg', 'activity.svg', 'snake.svg', 'snake-dark.svg')
          error_phrases = ('something went wrong', 'bad credentials',
                           'api rate limit exceeded', 'could not resolve to a user')
          for name in names:
              data = (source / name).read_bytes()
              root = ET.fromstring(data)
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  raise SystemExit(f'{name}: response is not SVG')
              text = ' '.join(root.itertext()).lower()
              if any(phrase in text for phrase in error_phrases):
                  raise SystemExit(f'{name}: generator returned an error card')
          PY

      - name: Publish the latest SVG snapshot
        shell: bash
        run: |
          set -euo pipefail
          # This branch contains generated files only and always has one root commit.
          target_ref=refs/heads/profile-assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Use an isolated index so README, scripts and workflow files cannot be published.
          snapshot_dir=$(mktemp -d)
          trap 'rm -rf "$snapshot_dir"' EXIT
          export GIT_INDEX_FILE="$snapshot_dir/index"
          git read-tree --empty
          for name in stats.svg top-langs.svg trophies.svg activity.svg snake.svg snake-dark.svg; do
            blob=$(git hash-object -w -- ".generated/profile-svg/$name")
            git update-index --add --cacheinfo "100644,$blob,$name"
          done
          tree=$(git write-tree)

          # An empty expected SHA permits creation only if the branch is still absent.
          # Network/authentication errors must fail instead of being treated as absence.
          remote_ref=$(git ls-remote --refs origin "$target_ref")
          expected_sha=""
          if [[ -n "$remote_ref" ]]; then
            git fetch --no-tags --depth=1 origin "$target_ref"
            expected_sha=$(git rev-parse FETCH_HEAD)
            previous_tree=$(git rev-parse "$expected_sha^{tree}")
            # Read the object itself; shallow fetches can hide parents from git log.
            parent_count=$(git cat-file commit "$expected_sha" |
              awk 'BEGIN { header=1 } header && /^parent / { n++ } /^$/ { header=0 } END { print n+0 }')
            if [[ "$tree" == "$previous_tree" && "$parent_count" == 0 ]]; then
              echo 'SVGs are unchanged; no publication needed.'
              exit 0
            fi
          fi

          # Omitting -p creates a fresh root, so previous daily snapshots are not ancestors.
          snapshot=$(git commit-tree "$tree" -m 'chore: update profile SVGs')
          git push --force-with-lease="$target_ref:$expected_sha" origin "$snapshot:$target_ref"
